services:
  mirenai:
    image: mirenai:dev
    environment:
      DATABASE_URL: sqlite:////data/mirenai.db
      API_LISTEN_ADDRESS: 0.0.0.0
      API_PORT: "8000"
      DNS_LISTEN_ADDRESS: 0.0.0.0
      DNS_PORT: "53"
      LOG_LEVEL: INFO
      TZ: Asia/Tokyo
    cap_add:
      # Required so the non-root user can bind privileged DNS port 53.
      - NET_BIND_SERVICE
    ports:
      - "8000:8000"
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - mirenai-data:/data

volumes:
  mirenai-data:
